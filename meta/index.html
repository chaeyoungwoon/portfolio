<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan Choi: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>

    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <!-- Time slider -->
    <label class="commit-slider-label">
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100" />
        <time id="commit-time"></time>
    </label>

    <!-- Summary stats -->
    <div id="stats"></div>

    <!-- Scrollytelling layout -->
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <dl id="commit-tooltip" class="info tooltip" hidden></dl>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <!-- File unit visualization -->
    <dl id="files"></dl>

</body>
</html>
